name: Build & Publish Trading Cortex Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip if this push to main was generated by the workflow's own version-bump commit
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version & ensure tag
        id: ver
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="v${VERSION}"
          else
            MANIFEST_VER=$(jq -r '.version' manifest.json)
            LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
            LATEST_VER="${LATEST_TAG#v}"

            # If manifest.json version already matches the latest published tag on a direct push/merge to main,
            # automatically increment the patch version (e.g. 1.1.6 -> 1.1.7)
            if [[ -n "$LATEST_VER" && "$MANIFEST_VER" == "$LATEST_VER" && ! "${{ github.event.head_commit.message }}" =~ ^Release\ v ]]; then
              IFS='.' read -r MAJOR MINOR PATCH <<< "$MANIFEST_VER"
              PATCH=$((PATCH + 1))
              VERSION="${MAJOR}.${MINOR}.${PATCH}"
              jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.tmp.json && mv manifest.tmp.json manifest.json
              git add manifest.json
              git commit -m "chore(release): auto-bump version to v${VERSION} [skip ci]"
              git push origin HEAD:main
            else
              VERSION="$MANIFEST_VER"
            fi

            TAG="v${VERSION}"
            git tag -f "$TAG"
            git push origin "$TAG" --force
          fi

          ZIP_NAME="trading-cortex-${VERSION}.zip"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Package extension ZIP
        run: |
          zip -r "${ZIP_NAME}" manifest.json background content icons popup update README.md RELEASE_NOTES.md -x "*.DS_Store*"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Trading Cortex ${{ env.TAG }}
          files: ${{ env.ZIP_NAME }}
          body_path: RELEASE_NOTES.md
          append_body: false
          generate_release_notes: false
